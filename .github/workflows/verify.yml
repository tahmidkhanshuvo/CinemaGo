name: Verify CinemaGo
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow-only
          POSTGRES_DB: cinemago_checks
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CinemaGo.Api --configuration Release
      - run: dotnet run --project tests/CinemaGo.WorkflowChecks
        env:
          CINEMAGO_TEST_CONNECTION: Host=localhost;Port=5432;Database=cinemago_checks;Username=workflow;Password=workflow-only
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
